name: "Run"
on: [pull_request, push]

permissions: {}

jobs:
  defaults:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
    - uses: mymindstorm/setup-emsdk@0822153d7a5488b70a269cfa0a631b2a86ab4da2 # master

    - name: Verify
      run: emcc -v
  actions-use-cache-test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup emsdk (use cache if found, create otherwise)  
        uses: mymindstorm/setup-emsdk@0822153d7a5488b70a269cfa0a631b2a86ab4da2 # master
        with:
          version: 2.0.20
          actions-cache-folder: 'emsdk-cache-folder'
          no-cache: true
          
      - name: Verify
        run: emcc -v
  no-install:
    runs-on: ubuntu-latest
    steps:
      - uses: mymindstorm/setup-emsdk@0822153d7a5488b70a269cfa0a631b2a86ab4da2 # master
        with:
          no-install: true

      - name: Verify
        run: emsdk list
  tot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup emsdk (use cache if found, create otherwise)  
        uses: mymindstorm/setup-emsdk@0822153d7a5488b70a269cfa0a631b2a86ab4da2 # master
        with:
          version: tot
          no-cache: true
          update-tags: true
          
      - name: Verify
        run: emcc -v
