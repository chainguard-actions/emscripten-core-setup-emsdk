name: Test no-install mode - emsdk on PATH without installing Emscripten
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          no-install: true
      - name: Assert emsdk is available on PATH
        run: |
          echo "Checking emsdk is on PATH..."
          which emsdk || { echo "FAIL: emsdk not found on PATH"; exit 1; }
          echo "PASS: emsdk found at $(which emsdk)"
      - name: Assert emcc is NOT available (no version installed)
        run: |
          echo "Checking emcc is NOT on PATH (no-install mode)..."
          if which emcc 2>/dev/null; then
            echo "WARN: emcc found at $(which emcc) - may be pre-installed in runner"
          else
            echo "PASS: emcc not on PATH as expected in no-install mode"
          fi
      - name: Assert emsdk list works
        run: |
          echo "Running emsdk list..."
          emsdk list || { echo "FAIL: emsdk list failed"; exit 1; }
          echo "PASS: emsdk list succeeded"
