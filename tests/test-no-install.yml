name: Test no-install mode (emsdk on PATH only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          no-install: true
          no-cache: true
      - name: Assert emsdk is on PATH
        run: |
          echo "Checking emsdk availability..."
          if ! command -v emsdk &>/dev/null; then
            echo "FAIL: emsdk not found on PATH"
            exit 1
          fi
          echo "PASS: emsdk found at $(command -v emsdk)"
      - name: Assert emcc is NOT installed
        run: |
          echo "Checking that emcc is not installed (no-install mode)..."
          if command -v emcc &>/dev/null; then
            echo "WARN: emcc found at $(command -v emcc) — may be a pre-existing install"
          else
            echo "PASS: emcc not found, as expected in no-install mode"
          fi
      - name: Assert emsdk list works
        run: |
          echo "Running emsdk list..."
          emsdk list
          echo "PASS: emsdk list succeeded"
