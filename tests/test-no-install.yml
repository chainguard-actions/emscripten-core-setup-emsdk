name: Test no-install mode - emsdk on PATH without installing Emscripten
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          no-install: true
          no-cache: true
      - name: Assert emsdk is on PATH
        run: |
          echo "Checking emsdk is on PATH..."
          if ! command -v emsdk >/dev/null 2>&1; then
            echo "FAIL: emsdk not found on PATH"
            exit 1
          fi
          echo "PASS: emsdk found at $(command -v emsdk)"
      - name: Assert emsdk help works
        run: |
          echo "Running emsdk help..."
          emsdk help
          if [ $? -ne 0 ]; then
            echo "FAIL: emsdk help returned non-zero exit code"
            exit 1
          fi
          echo "PASS: emsdk help succeeded"
      - name: Assert emcc is NOT installed (no-install mode)
        run: |
          echo "Checking emcc is NOT on PATH in no-install mode..."
          if command -v emcc >/dev/null 2>&1; then
            echo "NOTE: emcc found at $(command -v emcc) - this may be expected if a prior install exists"
          else
            echo "PASS: emcc not found on PATH as expected in no-install mode"
          fi
