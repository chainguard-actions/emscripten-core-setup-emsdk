name: Test no-install mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          no-install: 'true'
          no-cache: 'true'
      - name: Assert emsdk is available on PATH
        run: |
          echo "Checking emsdk is on PATH..."
          if ! command -v emsdk &>/dev/null; then
            echo "FAIL: emsdk not found on PATH"
            exit 1
          fi
          echo "emsdk found at: $(command -v emsdk)"
          echo "PASS"
      - name: Assert emcc is NOT installed
        run: |
          echo "Checking emcc is NOT on PATH (no-install mode)..."
          if command -v emcc &>/dev/null; then
            echo "WARN: emcc found on PATH in no-install mode (may be pre-installed)"
          else
            echo "PASS: emcc not on PATH as expected in no-install mode"
          fi
      - name: Assert emsdk help works
        run: |
          echo "Running emsdk help..."
          emsdk help
          if [ $? -ne 0 ]; then
            echo "FAIL: emsdk help returned non-zero exit code"
            exit 1
          fi
          echo "PASS"
