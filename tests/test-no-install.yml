name: Test no-install mode - emsdk in PATH without installing emscripten
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          no-install: "true"
          no-cache: "true"
      - name: Assert emsdk is available in PATH
        run: |
          echo "Checking emsdk availability..."
          if ! command -v emsdk &> /dev/null; then
            echo "FAIL: emsdk not found in PATH"
            exit 1
          fi
          echo "emsdk found at: $(which emsdk)"
          echo "PASS"
      - name: Assert emcc is NOT installed
        run: |
          echo "Checking that emcc is not installed (no-install mode)..."
          if command -v emcc &> /dev/null; then
            echo "WARN: emcc found in PATH even in no-install mode (may be pre-installed)"
          else
            echo "PASS: emcc not found in PATH as expected in no-install mode"
          fi
      - name: Assert EMSDK env var is set
        run: |
          echo "EMSDK=$EMSDK"
          if [ -z "$EMSDK" ]; then
            echo "FAIL: EMSDK environment variable is not set"
            exit 1
          fi
          echo "PASS"
