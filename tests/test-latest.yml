name: Test latest Emscripten installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          no-cache: true
      - name: Assert emcc is available
        run: |
          echo "Checking emcc availability..."
          if ! command -v emcc &>/dev/null; then
            echo "FAIL: emcc not found on PATH"
            exit 1
          fi
          echo "PASS: emcc found at $(command -v emcc)"
      - name: Assert emcc runs successfully
        run: |
          echo "Running emcc --version..."
          VERSION_OUTPUT=$(emcc --version 2>&1)
          echo "emcc version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: emcc --version produced no output"
            exit 1
          fi
          if ! echo "$VERSION_OUTPUT" | grep -qi "emscripten"; then
            echo "FAIL: emcc --version output does not mention Emscripten"
            exit 1
          fi
          echo "PASS: emcc is working correctly"
      - name: Assert emsdk is on PATH
        run: |
          if ! command -v emsdk &>/dev/null; then
            echo "FAIL: emsdk not found on PATH"
            exit 1
          fi
          echo "PASS: emsdk found at $(command -v emsdk)"
      - name: Assert em++ is available
        run: |
          if ! command -v em++ &>/dev/null; then
            echo "FAIL: em++ not found on PATH"
            exit 1
          fi
          echo "PASS: em++ found at $(command -v em++)"
