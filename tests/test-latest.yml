name: Test latest version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          no-cache: true
      - name: Assert emcc is available
        run: |
          echo "Checking emcc is on PATH..."
          which emcc || { echo "FAIL: emcc not found on PATH"; exit 1; }
          echo "PASS: emcc found at $(which emcc)"
      - name: Assert emcc runs successfully
        run: |
          VERSION_OUTPUT=$(emcc --version 2>&1)
          echo "emcc version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qi "emcc"; then
            echo "PASS: emcc version output looks valid"
          else
            echo "FAIL: unexpected emcc version output"
            exit 1
          fi
      - name: Assert emsdk is on PATH
        run: |
          echo "Checking emsdk is on PATH..."
          which emsdk || { echo "FAIL: emsdk not found on PATH"; exit 1; }
          echo "PASS: emsdk found at $(which emsdk)"
      - name: Assert em++ is available
        run: |
          echo "Checking em++ is on PATH..."
          which em++ || { echo "FAIL: em++ not found on PATH"; exit 1; }
          echo "PASS: em++ found at $(which em++)"
