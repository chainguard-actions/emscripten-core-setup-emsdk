name: Test latest version - default version with no-install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-emsdk
        uses: .
        with:
          version: 'latest'
          no-install: 'true'
          no-cache: 'true'
      - name: Assert emsdk is in PATH
        run: |
          echo "PATH: $PATH"
          echo "EMSDK: $EMSDK"
          echo "Checking emsdk availability..."
          if ! command -v emsdk > /dev/null 2>&1; then
            echo "FAIL: emsdk not found in PATH"
            exit 1
          fi
          echo "PASS: emsdk found at $(command -v emsdk)"
      - name: Assert EMSDK environment variable is set
        run: |
          echo "EMSDK env var: $EMSDK"
          if [ -z "$EMSDK" ]; then
            echo "FAIL: EMSDK environment variable is not set"
            exit 1
          fi
          echo "PASS: EMSDK is set to $EMSDK"
      - name: Assert emsdk directory exists and contains emsdk script
        run: |
          echo "Checking EMSDK directory contents..."
          if [ ! -d "$EMSDK" ]; then
            echo "FAIL: EMSDK directory does not exist at $EMSDK"
            exit 1
          fi
          if [ ! -f "$EMSDK/emsdk" ]; then
            echo "FAIL: emsdk script not found in $EMSDK"
            exit 1
          fi
          echo "PASS: emsdk script found at $EMSDK/emsdk"
      - name: Assert emsdk script is executable
        run: |
          echo "Checking emsdk script is executable..."
          EMSDK_SCRIPT="$EMSDK/emsdk"
          if [ ! -x "$EMSDK_SCRIPT" ]; then
            echo "FAIL: emsdk script is not executable at $EMSDK_SCRIPT"
            exit 1
          fi
          echo "PASS: emsdk script is executable at $EMSDK_SCRIPT"
