name: Test basic usage - install latest Emscripten
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
      - name: Assert emcc is available on PATH
        run: |
          echo "Checking emcc is on PATH..."
          which emcc || { echo "FAIL: emcc not found on PATH"; exit 1; }
          echo "PASS: emcc found at $(which emcc)"
      - name: Assert emcc version output
        run: |
          echo "Checking emcc --version..."
          emcc --version || { echo "FAIL: emcc --version failed"; exit 1; }
          echo "PASS: emcc --version succeeded"
      - name: Assert emsdk is available on PATH
        run: |
          echo "Checking emsdk is on PATH..."
          which emsdk || { echo "FAIL: emsdk not found on PATH"; exit 1; }
          echo "PASS: emsdk found at $(which emsdk)"
