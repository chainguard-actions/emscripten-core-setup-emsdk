name: Test basic usage - install latest Emscripten
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          no-cache: true
      - name: Assert emcc is available on PATH
        run: |
          echo "Checking emcc is on PATH..."
          if ! command -v emcc >/dev/null 2>&1; then
            echo "FAIL: emcc not found on PATH"
            exit 1
          fi
          echo "PASS: emcc found at $(command -v emcc)"
      - name: Assert emcc version output
        run: |
          echo "Running emcc --version..."
          emcc --version
          if [ $? -ne 0 ]; then
            echo "FAIL: emcc --version returned non-zero exit code"
            exit 1
          fi
          echo "PASS: emcc --version succeeded"
      - name: Assert emsdk is on PATH
        run: |
          echo "Checking emsdk is on PATH..."
          if ! command -v emsdk >/dev/null 2>&1; then
            echo "FAIL: emsdk not found on PATH"
            exit 1
          fi
          echo "PASS: emsdk found at $(command -v emsdk)"
