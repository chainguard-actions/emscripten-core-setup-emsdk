name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 3.1.50
          no-cache: true
      - name: Assert emcc is available on PATH
        run: |
          echo "Checking emcc is on PATH..."
          which emcc || { echo "FAIL: emcc not found on PATH"; exit 1; }
          echo "PASS: emcc found at $(which emcc)"
      - name: Assert correct version is installed
        run: |
          echo "Checking emcc version..."
          VERSION_OUTPUT=$(emcc --version 2>&1)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "3.1.50"; then
            echo "PASS: correct version 3.1.50 is installed"
          else
            echo "FAIL: expected version 3.1.50 but got: $VERSION_OUTPUT"
            exit 1
          fi
