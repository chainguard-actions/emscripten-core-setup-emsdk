name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 3.1.50
          no-cache: true
      - name: Assert emcc is available on PATH
        run: |
          echo "Checking emcc is on PATH..."
          if ! command -v emcc >/dev/null 2>&1; then
            echo "FAIL: emcc not found on PATH"
            exit 1
          fi
          echo "PASS: emcc found at $(command -v emcc)"
      - name: Assert correct version is installed
        run: |
          echo "Checking emcc version..."
          VERSION_OUTPUT=$(emcc --version 2>&1)
          echo "Version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "3.1.50"; then
            echo "FAIL: expected version 3.1.50 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: correct version 3.1.50 is installed"
      - name: Assert em++ is available
        run: |
          echo "Checking em++ is on PATH..."
          if ! command -v em++ >/dev/null 2>&1; then
            echo "FAIL: em++ not found on PATH"
            exit 1
          fi
          echo "PASS: em++ found at $(command -v em++)"
